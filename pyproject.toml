[project]
name = "ditto-talkinghead"
version = "0.4.0"
description = "Motion-Space Diffusion for Controllable Realtime Talking Head Synthesis"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Tianqi Li" },
    { name = "Ruobing Zheng" },
    { name = "Minghui Yang" },
    { name = "Jingdong Chen" },
    { name = "Ming Yang" },
]
keywords = ["talking-head", "diffusion", "avatar", "synthesis", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # Core dependencies
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "numpy==2.0.1",
    
    # CUDA (Windows compatible)
    "cuda-python>=12.6.0",
    "nvidia-cublas-cu12>=12.6.0",
    "nvidia-cuda-runtime-cu12>=12.6.0",
    "nvidia-cudnn-cu12>=9.6.0",
    
    # Audio processing
    "librosa>=0.10.2",
    "audioread>=3.0.0",
    "soundfile>=0.13.0",
    "soxr>=0.5.0",
    
    # Image/Video processing
    "opencv-python-headless>=4.10.0",
    "imageio>=2.36.0",
    "imageio-ffmpeg>=0.5.0",
    "pillow>=11.0.0",
    "scikit-image>=0.25.0",
    "tifffile>=2024.12.0",
    
    # Scientific computing
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    
    # Utilities
    "tqdm>=4.67.0",
    "filetype>=1.2.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "jinja2>=3.1.0",
    "cython>=3.0.0",
    "colored",
    
    # Additional dependencies
    "cffi>=1.17.0",
    "pycparser>=2.22",
    "decorator>=5.1.0",
    "joblib>=1.4.0",
    "lazy-loader>=0.4",
    "msgpack>=1.1.0",
    "packaging>=20.0",  # Relaxed for PyTorch index compatibility
    "platformdirs>=4.3.0",
    "pooch>=1.8.0",
    "threadpoolctl>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

training = [
    # Add training-specific dependencies here if needed
]

[project.urls]
Homepage = "https://digital-avatar.github.io/ai/Ditto/"
Repository = "https://github.com/antgroup/ditto-talkinghead"
Documentation = "https://digital-avatar.github.io/ai/Ditto/"
"Bug Tracker" = "https://github.com/antgroup/ditto-talkinghead/issues"
"HuggingFace Model" = "https://huggingface.co/digital-avatar/ditto-talkinghead"
Paper = "https://arxiv.org/abs/2411.19509"

[project.scripts]
ditto-inference = "inference:main"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-data]
core = ["**/*.onnx", "**/*.pkl", "**/*.pth", "**/*.engine", "**/*.so"]

# UV-specific configuration
[tool.uv]
# Additional indexes for PyPI
extra-index-url = ["https://download.pytorch.org/whl/cu121"]
# Allow UV to find best versions across all indexes
index-strategy = "unsafe-best-match"


# Development tools configuration
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | \.tox
  | build
  | dist
  | checkpoints
  | tmp
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=core --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.cython]
# Cython-specific settings if needed
language_level = "3"

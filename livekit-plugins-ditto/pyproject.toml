[project]
name = "livekit-plugins-ditto"
version = "0.1.0"
description = "LiveKit Agents plugin for Ditto TalkingHead avatar integration"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["livekit", "agents", "avatar", "ditto", "talking-head", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # LiveKit Core
    "livekit>=0.17.0",
    "livekit-agents>=0.12.0",
    "livekit-agents[silero, cartesia, openai,deepgram, elevenlabs, turn-detector, google]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv>=1.2.1",
    
    # Ditto Dependencies (as external resource)
    #"torch>=2.5.1",
    #"torchaudio>=2.5.1",
    #"torchvision>=0.20.1",
    #"numpy==2.0.1",
    
    # Audio processing
    "librosa>=0.10.2",
    "soundfile>=0.13.0",
    
    # Image/Video processing
    "opencv-python-headless>=4.10.0",
    "imageio>=2.36.0",
    "pillow>=11.0.0",
    
    # Utilities
    "tqdm>=4.67.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/livekit-plugins-ditto"
Documentation = "https://github.com/yourusername/livekit-plugins-ditto#readme"
Repository = "https://github.com/yourusername/livekit-plugins-ditto"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["livekit.plugins.ditto"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
